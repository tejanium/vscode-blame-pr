version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Must match engines.vscode; vsce rejects newer types than the engine floor
      - dependency-name: "@types/vscode"
      # Tracks the Node major in .node-version
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint peer range caps TypeScript at <6.1
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
