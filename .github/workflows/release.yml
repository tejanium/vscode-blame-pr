name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish
        type: choice
        default: both
        options: [both, marketplace, openvsx]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run package
      - uses: softprops/action-gh-release@v3
        if: github.event_name == 'push'
        with:
          files: "*.vsix"
          generate_release_notes: true
      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != '' && (github.event_name == 'push' || inputs.target != 'openvsx')
        run: bunx @vscode/vsce publish --no-dependencies --packagePath *.vsix
      - name: Publish to Open VSX
        if: env.OVSX_PAT != '' && (github.event_name == 'push' || inputs.target != 'marketplace')
        run: |
          bunx ovsx verify-pat tejanium || bunx ovsx create-namespace tejanium
          bunx ovsx publish *.vsix
